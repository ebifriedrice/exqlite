name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  publish-hex:
    name: Publish to Hex.pm
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      # dev so ex_doc is available and hex.publish ships the docs too;
      # the NIF is built from source so the job never races the artifacts
      # it is waiting for.
      MIX_ENV: dev
      EXQLITE_FORCE_BUILD: "1"
    steps:
      - uses: actions/checkout@v7

      - uses: erlef/setup-beam@v1
        with:
          otp-version: "29"
          elixir-version: "1.20"

      - uses: actions/cache@v6
        with:
          path: deps
          key: release-${{ runner.os }}-otp_29-elixir_1.20-mix_${{ hashFiles('**/mix.lock') }}
          restore-keys: release-${{ runner.os }}-otp_29-elixir_1.20-mix_

      - name: Install dependencies
        run: |
          mix deps.get
          mix deps.compile

      # The precompile workflows upload their tarballs to this tag's GitHub
      # release as their jobs finish. checksum --all only logs 404s for
      # targets that are not up yet and still exits zero, so the real gate
      # is verifying afterwards that every configured target made it into
      # checksum.exs.
      - name: Wait for precompiled artifacts and write checksum.exs
        run: |
          for attempt in $(seq 1 50); do
            mix elixir_make.checksum --all >/dev/null 2>&1
            if mix run --no-start -e '
              expected = CCPrecompiler.all_supported_targets(:fetch)
              {checksums, _} = Code.eval_file("checksum.exs")
              names = Map.keys(checksums)
              missing = Enum.reject(expected, fn t ->
                Enum.any?(names, &String.contains?(&1, "-" <> t <> "-"))
              end)
              if missing != [] do
                IO.puts(:stderr, "missing artifacts: #{Enum.join(missing, ", ")}")
                System.halt(1)
              end
            '; then
              echo "all precompiled artifacts are available"
              exit 0
            fi
            echo "attempt ${attempt}/50: artifacts still uploading; retrying in 60s"
            sleep 60
          done
          echo "::error::timed out waiting for precompiled artifacts"
          exit 1

      - name: Publish package and docs to Hex.pm
        run: mix hex.publish --yes
        env:
          HEX_API_KEY: ${{ secrets.HEX_PUBLISH_KEY }}
