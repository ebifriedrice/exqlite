name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  publish-hex:
    name: Publish to Hex.pm
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      # dev so ex_doc is available and hex.publish ships the docs too;
      # the NIF is built from source so the job never races the artifacts
      # it is waiting for.
      MIX_ENV: dev
      EXQLITE_FORCE_BUILD: "1"
    steps:
      - uses: actions/checkout@v7

      - uses: erlef/setup-beam@v1
        with:
          otp-version: "29"
          elixir-version: "1.20"

      - uses: actions/cache@v6
        with:
          path: deps
          key: release-${{ runner.os }}-otp_29-elixir_1.20-mix_${{ hashFiles('**/mix.lock') }}
          restore-keys: release-${{ runner.os }}-otp_29-elixir_1.20-mix_

      - name: Install dependencies
        run: |
          mix deps.get
          mix deps.compile

      # The precompile workflows upload their tarballs to this tag's GitHub
      # release as their jobs finish. checksum --all only succeeds once every
      # configured target has an artifact up, so retry until then.
      - name: Wait for precompiled artifacts and write checksum.exs
        run: |
          for attempt in $(seq 1 50); do
            if mix elixir_make.checksum --all; then
              echo "all precompiled artifacts are available"
              exit 0
            fi
            echo "attempt ${attempt}/50: artifacts still uploading; retrying in 60s"
            sleep 60
          done
          echo "::error::timed out waiting for precompiled artifacts"
          exit 1

      - name: Publish package and docs to Hex.pm
        run: mix hex.publish --yes
        env:
          HEX_API_KEY: ${{ secrets.HEX_PUBLISH_KEY }}
